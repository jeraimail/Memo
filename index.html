<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mémo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F5; --fg:#1F1D1A; --muted:#8A8477; --card:#FFFFFF; --line:#E6E1D8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --bg:#1C1B18; --fg:#F2EFE8; --muted:#A39D8E; --card:#262420; --line:#3A362F; }}
:root[data-theme="dark"]{ --bg:#1C1B18; --fg:#F2EFE8; --muted:#A39D8E; --card:#262420; --line:#3A362F; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Manrope',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.chip{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);color:var(--muted);background:var(--card)}
.chip.active{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{color:var(--muted);background:var(--card)}
.seg.sel{background:var(--fg);color:var(--bg)}
.card{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
input.text,select.text{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--fg);background:var(--card);font-family:inherit}
label.field{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;display:block}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--fg);color:var(--bg);border:none;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.btn.secondary{background:transparent;color:var(--err,#C94A4A);border:1px solid var(--line)}
.fab{width:44px;height:44px;border-radius:12px;background:var(--fg);color:var(--bg);border:none;font-size:22px;line-height:1;cursor:pointer}
.back{width:40px;height:40px;background:none;border:none;color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center}
.hidden{display:none !important}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 20px;line-height:1.6}
</style>
</head>
<body>
<div id="app">

  <!-- ÉCRAN LISTE -->
  <div id="screenList">
    <div style="padding:20px 20px 12px 20px;display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:24px;font-weight:800">Mémo</div>
      <button class="fab" id="btnAdd">+</button>
    </div>
    <div id="filters" style="display:flex;gap:8px;padding:4px 20px 16px 20px;overflow-x:auto"></div>
    <div id="list" style="flex:1;overflow-y:auto;padding:0 20px 20px 20px;display:flex;flex-direction:column;gap:10px"></div>
  </div>

  <!-- ÉCRAN ÉDITION -->
  <div id="screenEdit" class="hidden" style="display:flex;flex-direction:column;height:100%">
    <div style="padding:20px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)">
      <button class="back" id="btnBack">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div id="editTitle" style="font-size:17px;font-weight:800">Nouveau mémo</div>
    </div>
    <div style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px">
      <div>
        <label class="field" for="inpTitre">Titre du mémo</label>
        <input class="text" id="inpTitre" type="text" placeholder="Ex: Arroser les plantes">
      </div>
      <div>
        <label class="field">Catégorie</label>
        <div id="catPicker" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      </div>
      <div id="fieldMode" class="hidden">
        <label class="field">Mode d'affichage</label>
        <div style="display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden">
          <span class="seg" data-mode="immediat" style="flex:1;text-align:center;padding:10px 0;font-size:13px;font-weight:700;cursor:pointer">Immédiat</span>
          <span class="seg" data-mode="differe" style="flex:1;text-align:center;padding:10px 0;font-size:13px;font-weight:700;cursor:pointer;border-left:1px solid var(--line)">Différé</span>
        </div>
        <p style="font-size:12px;color:var(--muted);margin:8px 0 0 0;line-height:1.4" id="modeHelp"></p>
      </div>
      <div id="fieldTriggerLabel" class="hidden">
        <label class="field" id="triggerLabelText">Zone</label>
        <input class="text" id="inpTriggerLabel" type="text" placeholder="Ex: Maison">
      </div>
      <div id="fieldEmail" class="hidden">
        <label class="field">Destinataire</label>
        <input class="text" id="inpEmail" type="email" placeholder="exemple@mail.com">
      </div>
    </div>
    <div style="padding:16px 20px 24px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px">
      <button class="btn" id="btnSave">Enregistrer le mémo</button>
      <button class="btn secondary hidden" id="btnDelete">Supprimer ce mémo</button>
    </div>
  </div>

</div>

<script>
const CATEGORIES = [
  { id: 'boulot',  label: 'Boulot',  color: '#4A6FA5', trigger: 'geoloc' },
  { id: 'maison',  label: 'Maison',  color: '#C97B4A', trigger: 'geoloc' },
  { id: 'extra',   label: 'Extra',   color: '#7A8C64', trigger: 'geoloc' },
  { id: 'voiture', label: 'Voiture', color: '#9B5DE5', trigger: 'bluetooth' },
  { id: 'charge',  label: 'Charge',  color: '#3E9B8F', trigger: 'charge' },
  { id: 'memo',    label: 'Mémo',    color: '#5B5648', trigger: 'none' },
  { id: 'email',   label: 'Email',   color: '#D97757', trigger: 'none', special: 'email' },
];
const TRIGGER_LABELS = {
  geoloc: 'Zone',
  bluetooth: 'Appareil Bluetooth',
  charge: null,
};
const MODE_HELP = {
  immediat: "La notif+alarme s'affiche dès l'échéance, et une 2e fois au déclenchement.",
  differe: "La notif+alarme ne s'affiche qu'au déclenchement (pas dès l'échéance).",
};
const STORAGE_KEY = 'memo_items_v1';

function loadItems(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e){ return []; }
}
function saveItems(items){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}
function uid(){ return 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

let items = loadItems();
let activeFilter = 'all';
let editingId = null;
let pendingCat = CATEGORIES[0].id;
let pendingMode = 'differe';
let pendingTriggerLabel = '';
let pendingEmail = '';

const screenList = document.getElementById('screenList');
const screenEdit = document.getElementById('screenEdit');
const filtersEl = document.getElementById('filters');
const listEl = document.getElementById('list');
const catPicker = document.getElementById('catPicker');
const inpTitre = document.getElementById('inpTitre');
const editTitle = document.getElementById('editTitle');
const btnDelete = document.getElementById('btnDelete');
const fieldMode = document.getElementById('fieldMode');
const fieldTriggerLabel = document.getElementById('fieldTriggerLabel');
const fieldEmail = document.getElementById('fieldEmail');
const triggerLabelText = document.getElementById('triggerLabelText');
const inpTriggerLabel = document.getElementById('inpTriggerLabel');
const inpEmail = document.getElementById('inpEmail');
const modeHelp = document.getElementById('modeHelp');

function catById(id){ return CATEGORIES.find(c => c.id === id); }

function renderFilters(){
  filtersEl.innerHTML = '';
  const all = document.createElement('span');
  all.className = 'chip' + (activeFilter === 'all' ? ' active' : '');
  all.textContent = 'Tous';
  all.onclick = () => { activeFilter = 'all'; render(); };
  filtersEl.appendChild(all);
  CATEGORIES.forEach(c => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (activeFilter === c.id ? ' active' : '');
    chip.textContent = c.label;
    chip.onclick = () => { activeFilter = c.id; render(); };
    filtersEl.appendChild(chip);
  });
}

function renderList(){
  listEl.innerHTML = '';
  const visible = items.filter(i => activeFilter === 'all' || i.cat === activeFilter);
  if (visible.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = items.length === 0
      ? "Aucun mémo pour l'instant.\nAppuie sur + pour en créer un."
      : "Aucun mémo dans cette catégorie.";
    listEl.appendChild(empty);
    return;
  }
  visible.forEach(item => {
    const cat = catById(item.cat);
    let subtitle = '';
    if (cat.trigger !== 'none') {
      const modeLabel = item.mode === 'immediat' ? 'Immédiat' : 'Différé';
      subtitle = modeLabel + (item.triggerLabel ? ' · ' + escapeHtml(item.triggerLabel) : '');
    } else if (cat.special === 'email' && item.email) {
      subtitle = 'Vers ' + escapeHtml(item.email);
    }
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <span style="width:10px;height:10px;border-radius:50%;background:${cat.color};flex-shrink:0"></span>
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:700">${escapeHtml(item.titre)}</div>
        ${subtitle ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">${subtitle}</div>` : ''}
      </div>
      <span style="font-size:11px;font-weight:700;color:${cat.color};background:${cat.color}1A;padding:4px 9px;border-radius:7px">${cat.label}</span>
    `;
    card.onclick = () => openEdit(item.id);
    listEl.appendChild(card);
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderCatPicker(){
  catPicker.innerHTML = '';
  CATEGORIES.forEach(c => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (pendingCat === c.id ? ' active' : '');
    chip.textContent = c.label;
    chip.onclick = () => { pendingCat = c.id; renderConditionalFields(); };
    catPicker.appendChild(chip);
  });
  renderConditionalFields();
}

function renderModeToggle(){
  document.querySelectorAll('.seg[data-mode]').forEach(el => {
    el.classList.toggle('sel', el.dataset.mode === pendingMode);
  });
  modeHelp.textContent = MODE_HELP[pendingMode];
}

function renderConditionalFields(){
  catPicker.querySelectorAll('.chip').forEach((chip, i) => {
    chip.classList.toggle('active', CATEGORIES[i].id === pendingCat);
  });
  const cat = catById(pendingCat);

  if (cat.trigger !== 'none') {
    fieldMode.classList.remove('hidden');
    renderModeToggle();
  } else {
    fieldMode.classList.add('hidden');
  }

  const triggerLabel = TRIGGER_LABELS[cat.trigger];
  if (cat.trigger !== 'none' && triggerLabel) {
    fieldTriggerLabel.classList.remove('hidden');
    triggerLabelText.textContent = triggerLabel;
    inpTriggerLabel.value = pendingTriggerLabel;
    inpTriggerLabel.placeholder = cat.trigger === 'geoloc' ? 'Ex: Maison, Bureau…' : 'Ex: Autoradio';
  } else {
    fieldTriggerLabel.classList.add('hidden');
  }

  if (cat.special === 'email') {
    fieldEmail.classList.remove('hidden');
    inpEmail.value = pendingEmail;
  } else {
    fieldEmail.classList.add('hidden');
  }
}

document.querySelectorAll('.seg[data-mode]').forEach(el => {
  el.addEventListener('click', () => { pendingMode = el.dataset.mode; renderModeToggle(); });
});

function render(){
  renderFilters();
  renderList();
}

function openAdd(){
  editingId = null;
  inpTitre.value = '';
  pendingCat = CATEGORIES[0].id;
  pendingMode = 'differe';
  pendingTriggerLabel = '';
  pendingEmail = '';
  editTitle.textContent = 'Nouveau mémo';
  btnDelete.classList.add('hidden');
  renderCatPicker();
  screenList.classList.add('hidden');
  screenEdit.classList.remove('hidden');
}

function openEdit(id){
  const item = items.find(i => i.id === id);
  if (!item) return;
  editingId = id;
  inpTitre.value = item.titre;
  pendingCat = item.cat;
  pendingMode = item.mode || 'differe';
  pendingTriggerLabel = item.triggerLabel || '';
  pendingEmail = item.email || '';
  editTitle.textContent = 'Modifier le mémo';
  btnDelete.classList.remove('hidden');
  renderCatPicker();
  screenList.classList.add('hidden');
  screenEdit.classList.remove('hidden');
}

function closeEdit(){
  screenEdit.classList.add('hidden');
  screenList.classList.remove('hidden');
}

document.getElementById('btnAdd').addEventListener('click', openAdd);
document.getElementById('btnBack').addEventListener('click', closeEdit);

document.getElementById('btnSave').addEventListener('click', () => {
  const titre = inpTitre.value.trim();
  if (!titre) { inpTitre.focus(); return; }
  const cat = catById(pendingCat);
  const extra = {};
  if (cat.trigger !== 'none') {
    extra.mode = pendingMode;
    extra.triggerLabel = inpTriggerLabel.value.trim();
  }
  if (cat.special === 'email') {
    extra.email = inpEmail.value.trim();
  }
  if (editingId) {
    const item = items.find(i => i.id === editingId);
    item.titre = titre;
    item.cat = pendingCat;
    item.mode = extra.mode;
    item.triggerLabel = extra.triggerLabel;
    item.email = extra.email;
  } else {
    items.push({ id: uid(), titre, cat: pendingCat, ...extra });
  }
  saveItems(items);
  closeEdit();
  render();
});

btnDelete.addEventListener('click', () => {
  if (!editingId) return;
  items = items.filter(i => i.id !== editingId);
  saveItems(items);
  closeEdit();
  render();
});

render();
</script>
</body>
</html>
