<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnostic — Mémo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF9F5;--fg:#1F1D1A;--muted:#8A8477;--card:#FFFFFF;--line:#E6E1D8;--ok:#3E9B8F;--err:#C94A4A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1C1B18;--fg:#F2EFE8;--muted:#A39D8E;--card:#262420;--line:#3A362F}}
:root[data-theme="dark"]{--bg:#1C1B18;--fg:#F2EFE8;--muted:#A39D8E;--card:#262420;--line:#3A362F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Manrope',system-ui,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:24px 20px 40px 20px}
h1{font-size:20px;font-weight:800;margin:0 0 16px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.row:last-child{border-bottom:none}
.row span:first-child{color:var(--muted);flex-shrink:0}
.row span:last-child{font-weight:700;text-align:right;word-break:break-word}
button{width:100%;padding:13px;border-radius:10px;border:none;background:var(--fg);color:var(--bg);font-size:14px;font-weight:700;font-family:inherit;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
<h1>Diagnostic notifications</h1>
<div class="card" id="diag"></div>
<button id="ask">Redemander la permission</button>
<div class="card" id="result" style="margin-top:14px"></div>
</div>
<script>
const diag = document.getElementById('diag');
function row(label, value){
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = `<span>${label}</span><span>${value}</span>`;
  diag.appendChild(d);
}
row('Navigateur (userAgent)', navigator.userAgent);
row('Protocole', location.protocol);
row('Fenêtre top-level', window.top === window.self ? 'Oui' : 'Non (dans un cadre)');
row('API Notification', ('Notification' in window) ? 'Présente' : 'Absente');
row('Permission actuelle', ('Notification' in window) ? Notification.permission : '—');
if (navigator.permissions) {
  navigator.permissions.query({name:'notifications'}).then(p => {
    row('navigator.permissions', p.state);
  }).catch(e => row('navigator.permissions', 'Erreur: ' + e.message));
} else {
  row('navigator.permissions', 'Non supporté');
}

document.getElementById('ask').addEventListener('click', async () => {
  const result = document.getElementById('result');
  result.textContent = 'Appel en cours…';
  try {
    const p = await Notification.requestPermission();
    result.textContent = 'Résultat: ' + p;
  } catch (e) {
    result.textContent = 'Erreur levée: ' + e.name + ' — ' + e.message;
  }
});
</script>
</body>
</html>
